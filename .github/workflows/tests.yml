name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Lancer les tests (sans réseau, mode mock)
        run: python -m pytest
      - name: Démo sur le corpus fictif
        run: python pipeline/analyse_corpus.py data/exemple/corpus_exemple.csv --sortie /tmp/resultats
